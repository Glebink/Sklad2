<body class="vw-page">

<!-- Просмотр одного файла базы знаний на весь экран: Excel (листы вкладками внизу), Word, а в приложении
     на главном экране — ещё PDF и картинки (в браузере они открываются его собственным просмотрщиком). -->
<header class="vw-bar" id="vwBar">
  <a class="iconbtn vw-back" id="vwBack" href="./" title="К списку" aria-label="К списку">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
  </a>
  <span class="vw-title" id="vwTitle">Загрузка…</span>
  <div class="vw-zoom" id="vwZoom" title="Масштаб: Ctrl + колесо мыши или два пальца">
    <button class="util" id="vwZoomOut" aria-label="Уменьшить">−</button><button class="util" id="vwZoomReset" aria-label="Масштаб 100 %">100%</button><button class="util" id="vwZoomIn" aria-label="Увеличить">+</button>
  </div>
</header>

<main class="vw-viewer" id="vwViewer"><div class="vw-msg">Загрузка…</div></main>

<!-- листы Excel — как вкладки внизу в самом Excel -->
<nav class="vw-sheets" id="vwSheets" hidden></nav>
